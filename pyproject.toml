[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtc-reference"
version = "0.1.0"
description = "Compact training-time RTC implementation reference for model integration"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["jax==0.5.3", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["rtc_reference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/z-R-rr/rtc"
