name: RTC tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORMS: cpu
      CUDA_VISIBLE_DEVICES: ''
      XLA_FLAGS: --xla_force_host_platform_device_count=2
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Compile source
        run: uv run --no-sync python -m compileall -q src scripts packages/openpi-client/src
      - name: Test RTC on two virtual CPU devices
        shell: bash
        run: |
          source scripts/rtc_env.sh
          uv run --no-sync python -m pytest tests/rtc tests/test_fixed_noise_policy.py -q
